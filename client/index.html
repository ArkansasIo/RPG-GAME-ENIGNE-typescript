<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Warrior Content Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Backend + Frontend</p>
          <h1>Dragon Warrior Content Studio</h1>
          <p class="lead">Browse the content database, inspect assets, and export your data.</p>
        </div>
        <div class="header-actions">
          <button id="exportBtn">Export CSV</button>
        </div>
      </header>

      <section class="panel auth-panel" id="authPanel">
        <div class="panel-header">
          <h2>Account</h2>
        </div>
        <p id="welcome">Checking session...</p>
        <form id="loginForm" class="login-form">
          <input name="username" placeholder="Username" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Log in</button>
        </form>
        <form id="signupForm" class="login-form">
          <input name="username" placeholder="New username" required />
          <input name="password" type="password" placeholder="New password" required />
          <button type="submit" class="secondary">Create account</button>
        </form>
        <button id="logoutBtn" class="secondary">Log out</button>
        <p id="authMessage" class="auth-message"></p>
      </section>

      <section class="stats" id="stats"></section>

      <section class="panel">
        <div class="panel-header">
          <h2>Assets</h2>
          <span id="assetCount">0</span>
        </div>
        <div id="assetList" class="card-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Maps</h2>
          <span id="mapCount">0</span>
        </div>
        <div id="mapList" class="card-grid"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
